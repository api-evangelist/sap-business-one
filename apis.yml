aid: sap-business-one
name: SAP Business One
description: SAP Business One is an affordable, on-premise or cloud ERP solution designed for small and midsize
  businesses, covering finance and accounting, purchasing, inventory, sales, CRM, production, and analytics in a
  single integrated application. It exposes programmatic access through the Service Layer, a modern REST/OData v4
  API for the SAP HANA edition, alongside the legacy DI API and DI Server for SQL Server deployments. Authentication
  uses session-based login that returns a B1SESSION cookie used for subsequent OData calls against company databases.
